name: mettie
description: "Mettie — 반려동물 혈당 및 일상 기록 AI 어시스턴트"
publish_to: "none"

version: 1.0.0+12

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리 — Annotation/Generator 사용 금지, 순수 Notifier 방식
  flutter_riverpod: ^3.3.1

  # 라우팅
  go_router: ^17.2.3

  # BaaS — 인증, DB, 실시간 스트림
  supabase_flutter: ^2.12.4

  # 아이콘 — 앱 전체에서 이것만 사용 (Material Icons 금지)
  # 폰트 (Pretendard 로컬 에셋 방식 사용)
  google_fonts: ^6.2.1

  # 파일 시스템 (모델 파일 경로 등)
  path_provider: ^2.1.5
  lucide_icons_flutter: ^3.1.14+1
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.7
  intl: ^0.20.2
  flutter_gemma: ^1.6.5
  flutter_gemma_litertlm: ^1.5.2
  dio: ^5.9.2
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - .env
    - assets/icons/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  adaptive_icon_background: "#E0F2FE"
  adaptive_icon_foreground: "assets/icons/logo_splash.png"
  image_path: "assets/icons/logo_splash.png"

flutter_native_splash:
  color: "#E0F2FE"
  image: "assets/icons/logo_splash.png"
  android: true
  ios: true
  android_12:
    color: "#E0F2FE"
    image: "assets/icons/logo_splash.png"
